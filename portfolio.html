<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="Cybersecurity Analyst portfolio — penetration testing, threat hunting, SOC operations, and cloud security."/>
<meta name="keywords" content="cybersecurity, penetration testing, SOC, SIEM, security analyst, portfolio"/>
<meta name="google-site-verification" content="CFkz5Dmndjioh7kekrndQ1u0bl2_A_2kLzxh7pknaUA" />
<title>Ankit Ghimire — Cybersecurity Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════ */
:root {
  --accent: #00e5ff;
  --accent2: #7c3aed;
  --danger: #ff4d6d;
  --warn: #ffd60a;
  --green: #39d353;
  --radius: 6px;
  --radius-lg: 12px;
  --nav-h: 64px;
  --trans: 0.25s cubic-bezier(.4,0,.2,1);
}

[data-theme="dark"] {
  --bg: #060810;
  --bg2: #0c0f1a;
  --bg3: #111525;
  --bg4: #171c2e;
  --border: rgba(0,229,255,.08);
  --border2: rgba(0,229,255,.18);
  --text: #e2e8f0;
  --text2: #8892a4;
  --text3: #4a5568;
  --glow: 0 0 20px rgba(0,229,255,.15);
  --card-bg: rgba(12,15,26,.8);
}

[data-theme="light"] {
  --bg: #f0f4f8;
  --bg2: #ffffff;
  --bg3: #e8eef6;
  --bg4: #dde5f0;
  --border: rgba(0,120,180,.12);
  --border2: rgba(0,120,180,.3);
  --text: #0f172a;
  --text2: #475569;
  --text3: #94a3b8;
  --glow: 0 4px 20px rgba(0,100,200,.1);
  --card-bg: rgba(255,255,255,.9);
  --accent: #0077cc;
  --accent2: #6d28d9;
}

/* ═══════════════════════════════════════
   RESET & BASE
════════════════���══════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:var(--nav-h)}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:15px;
  line-height:1.7;
  overflow-x:hidden;
  transition:background var(--trans),color var(--trans);
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit}
ul{list-style:none}

/* ═══════════════════════════════════════
   SCROLLBAR
═══════════════════════════════════════ */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}

/* ═══════════════════════════════════════
   CANVAS BG
═══════════════════════════════════════ */
#bg-canvas{
  position:fixed;top:0;left:0;
  width:100%;height:100%;
  z-index:0;pointer-events:none;
  opacity:.35;
}

/* ═══════════════════════════════════════
   LAYOUT
═══════════════════════════════════════ */
.container{
  max-width:1100px;
  margin:0 auto;
  padding:0 1.5rem;
  position:relative;z-index:1;
}

section{
  padding:6rem 0;
  position:relative;
}

/* ═══════════════════════════════════════
   TYPOGRAPHY
═══════════════════════════════════════ */
.font-mono{font-family:'Share Tech Mono',monospace}
.font-display{font-family:'Rajdhani',sans-serif}

.section-tag{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:.6rem;
}

.section-title{
  font-family:'Rajdhani',sans-serif;
  font-size:clamp(2rem,4vw,3rem);
  font-weight:700;
  color:var(--text);
  line-height:1.1;
  margin-bottom:1rem;
}

.section-sub{
  color:var(--text2);
  font-size:14px;
  max-width:520px;
  margin-bottom:3rem;
}

/* ═══════════════════════════════════════
   NAVBAR
═══════════════════════════════════════ */
nav{
  position:fixed;top:0;left:0;right:0;
  z-index:1000;
  height:var(--nav-h);
  display:flex;align-items:center;
  border-bottom:1px solid var(--border);
  background:rgba(6,8,16,.85);
  backdrop-filter:blur(20px);
  transition:background var(--trans);
}

[data-theme="light"] nav{background:rgba(240,244,248,.92)}

.nav-inner{
  width:100%;max-width:1100px;
  margin:0 auto;padding:0 1.5rem;
  display:flex;align-items:center;
  justify-content:space-between;
}

.nav-logo{
  font-family:'Rajdhani',sans-serif;
  font-size:1.4rem;font-weight:700;
  display:flex;align-items:center;gap:8px;
}

.nav-logo-bracket{color:var(--accent)}
.nav-logo-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  animation:blink 1.4s infinite;
  box-shadow:0 0 8px var(--accent);
}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

.nav-links{
  display:flex;align-items:center;gap:.1rem;
}

.nav-link{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--text2);
  padding:.5rem .9rem;
  border-radius:var(--radius);
  transition:all var(--trans);
  position:relative;
}

.nav-link::after{
  content:'';position:absolute;
  bottom:4px;left:50%;right:50%;
  height:1px;background:var(--accent);
  transition:all var(--trans);
}

.nav-link:hover{color:var(--accent)}
.nav-link:hover::after{left:.9rem;right:.9rem}

.nav-right{display:flex;align-items:center;gap:.8rem}

.theme-btn{
  width:36px;height:36px;
  border-radius:50%;
  border:1px solid var(--border2);
  background:var(--bg3);
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;
  transition:all var(--trans);
}

.theme-btn:hover{border-color:var(--accent);color:var(--accent);box-shadow:var(--glow)}

.nav-cta{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;letter-spacing:.1em;
  padding:.45rem 1rem;
  border:1px solid var(--accent);
  color:var(--accent);
  border-radius:var(--radius);
  background:transparent;
  transition:all var(--trans);
}

.nav-cta:hover{background:var(--accent);color:#060810}

.hamburger{
  display:none;flex-direction:column;gap:5px;
  background:none;border:none;padding:4px;
}

.hamburger span{
  width:22px;height:2px;
  background:var(--text);
  transition:all var(--trans);
  display:block;
}

/* ═══════════════════════════════════════
   HERO
═══════════════════════════════════════ */
#hero{
  min-height:100vh;
  display:flex;align-items:center;
  padding-top:var(--nav-h);
  position:relative;
  overflow:hidden;
}

.hero-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4rem;
  align-items:center;
  width:100%;
}

.hero-tag{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;letter-spacing:.2em;
  color:var(--accent);margin-bottom:1.2rem;
  display:flex;align-items:center;gap:.6rem;
  opacity:0;animation:fadeUp .6s .1s forwards;
}

.hero-tag::before{
  content:'';display:inline-block;
  width:30px;height:1px;background:var(--accent);
}

.hero-name{
  font-family:'Rajdhani',sans-serif;
  font-size:clamp(3rem,6vw,5.5rem);
  font-weight:700;
  line-height:1;
  letter-spacing:-.01em;
  color:var(--text);
  opacity:0;animation:fadeUp .7s .2s forwards;
}

.hero-name-accent{
  color:var(--accent);
  display:block;
}

.hero-title-wrap{
  font-family:'Share Tech Mono',monospace;
  font-size:clamp(.85rem,1.5vw,1rem);
  color:var(--text2);
  margin-top:1rem;margin-bottom:.4rem;
  opacity:0;animation:fadeUp .7s .35s forwards;
}

.hero-title-wrap span{color:var(--accent)}

.hero-tagline{
  font-size:clamp(.9rem,1.5vw,1rem);
  color:var(--text2);
  max-width:440px;
  line-height:1.8;
  margin-bottom:2.5rem;
  opacity:0;animation:fadeUp .7s .45s forwards;
}

.hero-cta{
  display:flex;flex-wrap:wrap;gap:.8rem;
  opacity:0;animation:fadeUp .7s .6s forwards;
}

.btn{
  display:inline-flex;align-items:center;gap:.5rem;
  font-family:'Share Tech Mono',monospace;
  font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;
  padding:.7rem 1.5rem;
  border-radius:var(--radius);
  transition:all var(--trans);
  border:1px solid transparent;
}

.btn-primary{
  background:var(--accent);
  color:#060810;
  border-color:var(--accent);
  font-weight:500;
}

.btn-primary:hover{
  background:transparent;color:var(--accent);
  box-shadow:0 0 20px rgba(0,229,255,.3);
}

.btn-outline{
  border-color:var(--border2);
  color:var(--text2);
  background:transparent;
}

.btn-outline:hover{
  border-color:var(--accent);
  color:var(--accent);
}

.hero-stats{
  display:flex;gap:2rem;margin-top:3rem;
  padding-top:2rem;
  border-top:1px solid var(--border);
  opacity:0;animation:fadeUp .7s .75s forwards;
  flex-wrap:wrap;
}

.hero-stat-num{
  font-family:'Rajdhani',sans-serif;
  font-size:2rem;font-weight:700;
  color:var(--accent);line-height:1;
}

.hero-stat-label{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;letter-spacing:.1em;
  color:var(--text3);text-transform:uppercase;
  margin-top:.2rem;
}

/* Avatar */
.hero-visual{
  display:flex;justify-content:center;align-items:center;
  opacity:0;animation:fadeUp .8s .3s forwards;
}

.avatar-ring{
  position:relative;
  width:clamp(260px,30vw,380px);
  height:clamp(260px,30vw,380px);
}

.avatar-ring-outer{
  position:absolute;inset:-16px;
  border-radius:50%;
  border:1px dashed rgba(0,229,255,.2);
  animation:spin 20s linear infinite;
}

.avatar-ring-inner{
  position:absolute;inset:0;
  border-radius:50%;
  border:2px solid rgba(0,229,255,.12);
  box-shadow:inset 0 0 60px rgba(0,229,255,.05);
}

.avatar-dots{
  position:absolute;inset:-16px;
  animation:spin 20s linear infinite;
}

.avatar-dot{
  position:absolute;
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 8px var(--accent);
}

.avatar-dot:nth-child(1){top:0;left:50%;transform:translateX(-50%)}
.avatar-dot:nth-child(2){bottom:0;left:50%;transform:translateX(-50%)}
.avatar-dot:nth-child(3){left:0;top:50%;transform:translateY(-50%)}
.avatar-dot:nth-child(4){right:0;top:50%;transform:translateY(-50%)}

@keyframes spin{to{transform:rotate(360deg)}}

.avatar-img{
  position:absolute;inset:0;
  border-radius:50%;overflow:hidden;
  background:var(--bg3);
  display:flex;align-items:center;justify-content:center;
  font-family:'Rajdhani',sans-serif;
  font-size:5rem;font-weight:700;
  color:var(--accent);
  border:2px solid var(--border2);
}

.avatar-img-photo{
  width:100%;height:100%;object-fit:cover;
  border-radius:50%;
}

.avatar-badge{
  position:absolute;bottom:10px;right:10px;
  background:var(--bg2);
  border:1px solid var(--border2);
  border-radius:var(--radius);
  padding:.5rem .9rem;
  font-family:'Share Tech Mono',monospace;
  font-size:11px;color:var(--accent);
  display:flex;align-items:center;gap:.5rem;
  box-shadow:var(--glow);
}

.status-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 6px var(--green);
  animation:blink 1.4s infinite;
}

.social-float{
  position:absolute;left:-60px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:.7rem;
}

.social-icon-btn{
  width:38px;height:38px;border-radius:50%;
  border:1px solid var(--border);
  background:var(--bg2);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;color:var(--text2);
  transition:all var(--trans);
}

.social-icon-btn:hover{
  border-color:var(--accent);color:var(--accent);
  box-shadow:var(--glow);transform:scale(1.1);
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* ═══════════════════════════════════════
   ABOUT
═══════════════════════════════════════ */
.about-grid{
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:4rem;align-items:start;
}

.about-card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:2rem;
  backdrop-filter:blur(10px);
  position:sticky;top:80px;
}

.about-card-top{
  display:flex;align-items:center;gap:1rem;
  margin-bottom:1.5rem;
  padding-bottom:1.5rem;
  border-bottom:1px solid var(--border);
}

.about-avatar{
  width:64px;height:64px;border-radius:50%;
  background:var(--bg3);
  border:2px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-family:'Rajdhani',sans-serif;
  font-size:1.8rem;font-weight:700;
  color:var(--accent);flex-shrink:0;
}

.about-name{
  font-family:'Rajdhani',sans-serif;
  font-size:1.3rem;font-weight:700;
  color:var(--text);
}

.about-role{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;color:var(--accent);
  letter-spacing:.08em;
}

.about-info-row{
  display:flex;align-items:flex-start;gap:.8rem;
  padding:.6rem 0;
  border-bottom:1px solid var(--border);
  font-size:13px;
}

.about-info-row:last-child{border-bottom:none}

.about-info-label{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;color:var(--text3);
  letter-spacing:.08em;min-width:80px;
  padding-top:.15rem;
}

.about-info-val{color:var(--text2)}
.about-info-val a{color:var(--accent)}

.about-text p{
  color:var(--text2);margin-bottom:1.2rem;
  font-size:14px;line-height:1.9;
}

.about-text p strong{color:var(--text)}

.interests-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:.6rem;margin-top:1.5rem;
}

.interest-chip{
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:.5rem .8rem;
  font-family:'Share Tech Mono',monospace;
  font-size:11px;color:var(--text2);
  display:flex;align-items:center;gap:.5rem;
  transition:all var(--trans);
}

.interest-chip:hover{border-color:var(--accent);color:var(--accent)}

/* ═══════════════════════════════════════
   TIMELINE (Education & Experience)
═══════════════════════════════════════ */
.timeline{
  position:relative;
  padding-left:2rem;
}

.timeline::before{
  content:'';
  position:absolute;left:0;top:0;bottom:0;
  width:1px;
  background:linear-gradient(to bottom,transparent,var(--accent),transparent);
}

.timeline-item{
  position:relative;
  margin-bottom:2.5rem;
  opacity:0;transform:translateX(-20px);
  transition:all .5s;
}

.timeline-item.visible{opacity:1;transform:none}

.timeline-dot{
  position:absolute;left:-2rem;top:1.4rem;
  width:9px;height:9px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px var(--accent);
  transform:translateX(-4px);
}

.timeline-card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:1.5rem 1.8rem;
  backdrop-filter:blur(10px);
  transition:all var(--trans);
  cursor:default;
}

.timeline-card:hover{
  border-color:var(--border2);
  box-shadow:var(--glow);
  transform:translateY(-2px);
}

.timeline-header{
  display:flex;align-items:flex-start;
  justify-content:space-between;
  gap:1rem;flex-wrap:wrap;
  margin-bottom:.8rem;
}

.timeline-title{
  font-family:'Rajdhani',sans-serif;
  font-size:1.1rem;font-weight:600;
  color:var(--text);
}

.timeline-sub{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;color:var(--accent);
  letter-spacing:.06em;margin-top:.2rem;
}

.timeline-date{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;color:var(--text3);
  letter-spacing:.06em;white-space:nowrap;
  background:var(--bg3);
  padding:.3rem .7rem;
  border-radius:var(--radius);
  border:1px solid var(--border);
}

.timeline-desc{
  font-size:13px;color:var(--text2);
  line-height:1.8;margin-bottom:1rem;
}

.tag-list{display:flex;flex-wrap:wrap;gap:.4rem}

.tag{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;letter-spacing:.06em;
  padding:.25rem .6rem;
  border-radius:3px;
  border:1px solid var(--border);
  color:var(--text3);
  background:var(--bg3);
}

/* ═══════════════════════════════════════
   SKILLS
═══════════════════════════════════════ */
.skills-categories{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
  gap:1.2rem;
}

.skill-cat{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:1.5rem;
  backdrop-filter:blur(10px);
  transition:all var(--trans);
  opacity:0;transform:translateY(20px);
}

.skill-cat.visible{opacity:1;transform:none}

.skill-cat:hover{
  border-color:var(--border2);
  box-shadow:var(--glow);
}

.skill-cat-header{
  display:flex;align-items:center;gap:.8rem;
  margin-bottom:1.2rem;
  padding-bottom:1rem;
  border-bottom:1px solid var(--border);
}

.skill-cat-icon{
  width:38px;height:38px;
  border-radius:var(--radius);
  background:rgba(0,229,255,.07);
  border:1px solid rgba(0,229,255,.15);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
}

.skill-cat-name{
  font-family:'Rajdhani',sans-serif;
  font-size:1rem;font-weight:600;
  color:var(--text);
}

.skill-item{
  margin-bottom:.9rem;
}

.skill-item:last-child{margin-bottom:0}

.skill-row{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:.35rem;
}

.skill-name-text{
  font-size:13px;color:var(--text2);
}

.skill-pct{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;color:var(--accent);
}

.skill-bar{
  height:3px;
  background:var(--bg3);
  border-radius:2px;
  overflow:hidden;
}

.skill-fill{
  height:100%;
  background:linear-gradient(90deg,var(--accent2),var(--accent));
  border-radius:2px;
  width:0;
  transition:width 1s cubic-bezier(.4,0,.2,1);
}

.skill-tools{
  display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1.2rem;
  padding-top:1rem;border-top:1px solid var(--border);
}

/* ═══════════════════════════════════════
   PROJECTS
═══════════════════════════════════════ */
.projects-filter{
  display:flex;flex-wrap:wrap;gap:.6rem;
  margin-bottom:2.5rem;
}

.filter-btn{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;letter-spacing:.08em;
  padding:.4rem .9rem;
  border-radius:var(--radius);
  border:1px solid var(--border);
  background:transparent;
  color:var(--text3);
  transition:all var(--trans);
}

.filter-btn.active,
.filter-btn:hover{
  border-color:var(--accent);
  color:var(--accent);
  background:rgba(0,229,255,.05);
}

.projects-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:1.2rem;
}

.project-card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  overflow:hidden;
  transition:all var(--trans);
  opacity:0;transform:translateY(20px);
  backdrop-filter:blur(10px);
}

.project-card.visible{opacity:1;transform:none}

.project-card:hover{
  border-color:var(--border2);
  box-shadow:var(--glow);
  transform:translateY(-4px);
}

.project-preview{
  height:140px;
  background:var(--bg3);
  display:flex;align-items:center;justify-content:center;
  font-size:3rem;
  position:relative;overflow:hidden;
  border-bottom:1px solid var(--border);
}

.project-preview-code{
  position:absolute;
  font-family:'Share Tech Mono',monospace;
  font-size:9px;color:rgba(0,229,255,.15);
  line-height:1.4;padding:1rem;
  white-space:pre;letter-spacing:.05em;
  top:0;left:0;width:100%;
}

.project-preview-icon{
  font-size:2.5rem;position:relative;z-index:1;
}

.project-body{padding:1.4rem}

.project-tags{
  display:flex;flex-wrap:wrap;gap:.4rem;
  margin-bottom:.8rem;
}

.project-tag{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;letter-spacing:.05em;
  padding:.2rem .6rem;
  border-radius:3px;
  background:rgba(0,229,255,.07);
  border:1px solid rgba(0,229,255,.15);
  color:var(--accent);
}

.project-title{
  font-family:'Rajdhani',sans-serif;
  font-size:1.1rem;font-weight:600;
  color:var(--text);margin-bottom:.5rem;
}

.project-desc{
  font-size:13px;color:var(--text2);
  line-height:1.7;margin-bottom:1.2rem;
}

.project-links{
  display:flex;gap:.8rem;
  border-top:1px solid var(--border);
  padding-top:1rem;
}

.project-link{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;letter-spacing:.06em;
  color:var(--text3);
  display:flex;align-items:center;gap:.4rem;
  transition:color var(--trans);
}

.project-link:hover{color:var(--accent)}

.project-severity{
  margin-left:auto;
  font-family:'Share Tech Mono',monospace;
  font-size:10px;padding:.2rem .7rem;
  border-radius:3px;
}

.sev-crit{background:rgba(255,77,109,.12);color:var(--danger);border:1px solid rgba(255,77,109,.25)}
.sev-high{background:rgba(255,214,10,.1);color:var(--warn);border:1px solid rgba(255,214,10,.2)}
.sev-med{background:rgba(0,229,255,.07);color:var(--accent);border:1px solid rgba(0,229,255,.15)}

/* ═══════════════════════════════════════
   CERTIFICATIONS
═══════════════════════════════════════ */
.certs-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:1rem;
}

.cert-card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:1.4rem;
  display:flex;gap:1rem;align-items:flex-start;
  backdrop-filter:blur(10px);
  transition:all var(--trans);
  opacity:0;transform:translateY(15px);
}

.cert-card.visible{opacity:1;transform:none}
.cert-card:hover{border-color:var(--border2);box-shadow:var(--glow);transform:translateY(-2px)}

.cert-badge{
  width:48px;height:48px;
  border-radius:var(--radius);
  background:var(--bg3);
  border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;flex-shrink:0;
}

.cert-name{
  font-family:'Rajdhani',sans-serif;
  font-size:.95rem;font-weight:600;
  color:var(--text);margin-bottom:.2rem;
}

.cert-issuer{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;color:var(--accent);
  letter-spacing:.06em;margin-bottom:.4rem;
}

.cert-date{
  font-size:12px;color:var(--text3);
}

.cert-status{
  display:inline-flex;align-items:center;gap:.4rem;
  font-family:'Share Tech Mono',monospace;
  font-size:10px;letter-spacing:.06em;
  margin-top:.5rem;
  padding:.2rem .6rem;
  border-radius:3px;
}

.status-active{
  background:rgba(57,211,83,.1);
  color:var(--green);
  border:1px solid rgba(57,211,83,.2);
}

.status-in-progress{
  background:rgba(255,214,10,.1);
  color:var(--warn);
  border:1px solid rgba(255,214,10,.2);
}

/* ═══════════════════════════════════════
   TERMINAL
═══════════════════════════════════════ */
.terminal-wrap{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  overflow:hidden;
  font-family:'Share Tech Mono',monospace;
  max-width:800px;margin:0 auto;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.terminal-bar{
  display:flex;align-items:center;gap:.6rem;
  padding:.7rem 1rem;
  background:var(--bg3);
  border-bottom:1px solid var(--border);
}

.terminal-dot{
  width:11px;height:11px;border-radius:50%;
}

.t-red{background:#ff5f56}
.t-yellow{background:#ffbd2e}
.t-green{background:#27c93f}

.terminal-title{
  font-size:11px;color:var(--text3);
  letter-spacing:.06em;margin-left:.5rem;
}

.terminal-body{
  padding:1.5rem;
  min-height:280px;
  max-height:380px;
  overflow-y:auto;
  font-size:13px;line-height:1.7;
}

.t-prompt{color:var(--accent)}
.t-cmd{color:var(--text)}
.t-out{color:var(--text2)}
.t-err{color:var(--danger)}
.t-success{color:var(--green)}
.t-warn-t{color:var(--warn)}

.terminal-input-row{
  display:flex;align-items:center;gap:.5rem;
  padding:.6rem 1.5rem 1rem;
}

.terminal-input{
  flex:1;
  background:none;border:none;outline:none;
  font-family:'Share Tech Mono',monospace;
  font-size:13px;color:var(--text);
  caret-color:var(--accent);
