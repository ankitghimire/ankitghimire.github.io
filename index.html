<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Access Required</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

body{
  background:#060810;
  color:#e2e8f0;
  font-family:'Share Tech Mono',monospace;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  overflow:hidden;
}

canvas{
  position:fixed;inset:0;
  z-index:0;pointer-events:none;
  opacity:.3;
}

/* ── Card ── */
.card{
  position:relative;z-index:1;
  width:min(420px,90vw);
  background:rgba(12,15,26,.85);
  border:1px solid rgba(0,229,255,.12);
  border-radius:12px;
  padding:2.5rem 2rem;
  backdrop-filter:blur(20px);
  box-shadow:0 0 60px rgba(0,229,255,.06);
  animation:fadeIn .6s ease forwards;
}

@keyframes fadeIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* glowing top border */
.card::before{
  content:'';position:absolute;
  top:-1px;left:20%;right:20%;height:2px;
  background:linear-gradient(90deg,transparent,#00e5ff,transparent);
  border-radius:2px;
  animation:shimmer 3s linear infinite;
}

@keyframes shimmer{
  0%{left:20%;right:60%}
  50%{left:20%;right:20%}
  100%{left:60%;right:20%}
}

/* ── Lock icon ── */
.lock-wrap{
  display:flex;justify-content:center;
  margin-bottom:1.6rem;
}

.lock-ring{
  width:72px;height:72px;border-radius:50%;
  border:1px solid rgba(0,229,255,.18);
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,229,255,.04);
  position:relative;
  animation:pulse-ring 2.5s ease-in-out infinite;
}

@keyframes pulse-ring{
  0%,100%{box-shadow:0 0 0 0 rgba(0,229,255,.2)}
  50%{box-shadow:0 0 0 10px rgba(0,229,255,.0)}
}

.lock-icon{font-size:1.8rem;filter:drop-shadow(0 0 8px #00e5ff)}

/* ── Labels ── */
.card-title{
  font-family:'Rajdhani',sans-serif;
  font-size:1.7rem;font-weight:700;
  text-align:center;color:#e2e8f0;
  letter-spacing:.02em;
  margin-bottom:.35rem;
}

.card-sub{
  text-align:center;
  font-size:11px;letter-spacing:.12em;
  color:#4a5568;
  text-transform:uppercase;
  margin-bottom:2rem;
}

.prompt-line{
  font-size:12px;color:#8892a4;
  margin-bottom:.6rem;
  display:flex;align-items:center;gap:.5rem;
}

.prompt-line::before{content:'//';color:#00e5ff}

/* ── Input ── */
.input-wrap{
  position:relative;margin-bottom:1rem;
}

.pw-input{
  width:100%;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(0,229,255,.12);
  border-radius:6px;
  padding:.75rem 3rem .75rem 1rem;
  font-family:'Share Tech Mono',monospace;
  font-size:14px;color:#e2e8f0;
  outline:none;
  letter-spacing:.15em;
  transition:border-color .25s,box-shadow .25s;
  caret-color:#00e5ff;
}

.pw-input:focus{
  border-color:rgba(0,229,255,.4);
  box-shadow:0 0 0 3px rgba(0,229,255,.07);
}

.pw-input.error{
  border-color:rgba(255,77,109,.5);
  box-shadow:0 0 0 3px rgba(255,77,109,.07);
  animation:shake .35s ease;
}

@keyframes shake{
  0%,100%{transform:none}
  20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}

.toggle-vis{
  position:absolute;right:.8rem;top:50%;transform:translateY(-50%);
  background:none;border:none;
  color:#4a5568;font-size:14px;cursor:pointer;
  transition:color .2s;padding:4px;
}
.toggle-vis:hover{color:#00e5ff}

/* ── Error msg ── */
.err-msg{
  font-size:11px;
  color:#ff4d6d;
  letter-spacing:.06em;
  min-height:16px;
  margin-bottom:.8rem;
  display:flex;align-items:center;gap:.4rem;
  opacity:0;transition:opacity .2s;
}
.err-msg.show{opacity:1}
.err-msg::before{content:'!';display:inline-flex;width:14px;height:14px;
  border-radius:50%;border:1px solid #ff4d6d;
  align-items:center;justify-content:center;font-size:9px;flex-shrink:0}

/* ── Button ── */
.btn-access{
  width:100%;
  padding:.8rem;
  background:#00e5ff;
  color:#060810;
  border:none;border-radius:6px;
  font-family:'Share Tech Mono',monospace;
  font-size:13px;letter-spacing:.1em;font-weight:600;
  cursor:pointer;
  transition:all .25s;
  display:flex;align-items:center;justify-content:center;gap:.5rem;
}

.btn-access:hover{
  background:transparent;
  color:#00e5ff;
  border:1px solid #00e5ff;
  box-shadow:0 0 20px rgba(0,229,255,.25);
}

.btn-access:active{transform:scale(.98)}

.btn-access.loading{
  pointer-events:none;
  opacity:.7;
}

/* ── Attempts indicator ── */
.attempts{
  text-align:center;
  font-size:10px;color:#4a5568;
  margin-top:1.2rem;
  letter-spacing:.08em;
  min-height:16px;
}

.attempts span{color:#ff4d6d}

/* ── Footer ── */
.card-footer{
  text-align:center;
  margin-top:1.8rem;
  padding-top:1.2rem;
  border-top:1px solid rgba(255,255,255,.04);
  font-size:10px;color:#2d3748;
  letter-spacing:.08em;
}

/* ── Locked state (after too many attempts) ── */
.lockout-msg{
  text-align:center;
  padding:1rem;
  background:rgba(255,77,109,.06);
  border:1px solid rgba(255,77,109,.18);
  border-radius:6px;
  color:#ff4d6d;
  font-size:12px;
  line-height:1.7;
  display:none;
}

.lockout-msg.show{display:block}

/* ── Success overlay ── */
.success-overlay{
  position:fixed;inset:0;
  z-index:999;
  background:#060810;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:1rem;
  opacity:0;pointer-events:none;
  transition:opacity .4s;
}

.success-overlay.show{opacity:1;pointer-events:all}

.success-text{
  font-family:'Rajdhani',sans-serif;
  font-size:2rem;font-weight:700;
  color:#00e5ff;
  letter-spacing:.05em;
}

.success-sub{
  font-size:12px;color:#4a5568;
  letter-spacing:.1em;
}

.progress-bar-wrap{
  width:200px;height:2px;
  background:rgba(0,229,255,.1);
  border-radius:2px;overflow:hidden;
}

.progress-bar-fill{
  height:100%;width:0;
  background:#00e5ff;
  transition:width 1.4s linear;
}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<!-- Success overlay -->
<div class="success-overlay" id="successOverlay">
  <div style="font-size:2.5rem;filter:drop-shadow(0 0 12px #00e5ff)">🔓</div>
  <div class="success-text">ACCESS GRANTED</div>
  <div class="success-sub">// Redirecting to portfolio...</div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressFill"></div>
  </div>
</div>

<!-- Auth card -->
<div class="card" id="authCard">
  <div class="lock-wrap">
    <div class="lock-ring">
      <div class="lock-icon" id="lockIcon">🔒</div>
    </div>
  </div>

  <h1 class="card-title">Restricted Access</h1>
  <p class="card-sub">Portfolio — Private Preview</p>

  <p class="prompt-line">Enter access password to continue</p>

  <div class="input-wrap">
    <input
      class="pw-input"
      id="pwInput"
      type="password"
      placeholder="••••••••••••"
      autocomplete="current-password"
      autofocus
      maxlength="64"
    />
    <button class="toggle-vis" id="toggleVis" type="button" aria-label="Show/hide password">👁</button>
  </div>

  <div class="err-msg" id="errMsg">Incorrect password. Try again.</div>

  <button class="btn-access" id="accessBtn">
    <span id="btnText">AUTHENTICATE</span>
  </button>

  <div class="lockout-msg" id="lockoutMsg">
    🔒 Too many failed attempts.<br>
    Access locked for <span id="countdown">30</span> seconds.
  </div>

  <div class="attempts" id="attemptsInfo"></div>

  <div class="card-footer">
    Ankit Ghimire · PORTFOLIO · 2026
  </div>
</div>

<script>
// ── Canvas particles ──────────────────────────────────
(function(){
  const c=document.getElementById('bg');
  const x=c.getContext('2d');
  let W,H,pts=[];
  function resize(){W=c.width=innerWidth;H=c.height=innerHeight}
  function init(){
    resize();pts=[];
    const n=Math.floor(W*H/22000);
    for(let i=0;i<n;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.2+.4});
  }
  function draw(){
    x.clearRect(0,0,W,H);
    for(let i=0;i<pts.length;i++){
      for(let j=i+1;j<pts.length;j++){
        const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.hypot(dx,dy);
        if(d<120){x.beginPath();x.strokeStyle=`rgba(0,229,255,${.1*(1-d/120)})`;x.lineWidth=.5;x.moveTo(pts[i].x,pts[i].y);x.lineTo(pts[j].x,pts[j].y);x.stroke()}
      }
    }
    pts.forEach(p=>{
      x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);
      x.fillStyle='rgba(0,229,255,.45)';x.fill();
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',init);
  init();draw();
})();

// ── Auth logic ────────────────────────────────────────
(function(){
  // ⚠ CHANGE THIS PASSWORD before publishing
  const CORRECT = '6969696969';
  const PORTFOLIO_PAGE = 'portfolio.html';   // <-- your main portfolio file
  const MAX_ATTEMPTS = 5;
  const LOCKOUT_SECS = 30;

  const input      = document.getElementById('pwInput');
  const btn        = document.getElementById('accessBtn');
  const errMsg     = document.getElementById('errMsg');
  const attemptsEl = document.getElementById('attemptsInfo');
  const lockoutEl  = document.getElementById('lockoutMsg');
  const cdEl       = document.getElementById('countdown');
  const toggleBtn  = document.getElementById('toggleVis');
  const lockIcon   = document.getElementById('lockIcon');
  const overlay    = document.getElementById('successOverlay');
  const progress   = document.getElementById('progressFill');

  let attempts = parseInt(sessionStorage.getItem('pw_attempts')||'0');
  let locked   = false;
  let lockTimer = null;

  // Check if already authenticated this session
  if(sessionStorage.getItem('pw_auth')==='1'){
    window.location.replace(PORTFOLIO_PAGE);
  }

  // Restore lockout if page was refreshed mid-lockout
  const lockUntil = parseInt(sessionStorage.getItem('pw_lockuntil')||'0');
  if(Date.now()<lockUntil){
    startLockout(Math.ceil((lockUntil-Date.now())/1000));
  }

  // Show/hide password
  toggleBtn.addEventListener('click',()=>{
    const show = input.type==='password';
    input.type = show?'text':'password';
    toggleBtn.textContent = show?'🙈':'👁';
  });

  // Submit on Enter
  input.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
  btn.addEventListener('click',check);

  // Clear error on type
  input.addEventListener('input',()=>{
    input.classList.remove('error');
    errMsg.classList.remove('show');
  });

  function check(){
    if(locked)return;
    const val = input.value;
    if(!val){
      input.classList.add('error');
      errMsg.textContent='Please enter the access password.';
      errMsg.classList.add('show');
      return;
    }

    if(val===CORRECT){
      grant();
    }else{
      attempts++;
      sessionStorage.setItem('pw_attempts',attempts);
      input.classList.add('error');
      input.value='';

      const remaining = MAX_ATTEMPTS - attempts;

      if(attempts>=MAX_ATTEMPTS){
        const until = Date.now()+LOCKOUT_SECS*1000;
        sessionStorage.setItem('pw_lockuntil',until);
        startLockout(LOCKOUT_SECS);
      }else{
        errMsg.textContent=`Incorrect password. ${remaining} attempt${remaining===1?'':'s'} remaining.`;
        errMsg.classList.add('show');
        if(attempts>=2){
          attemptsEl.innerHTML=`<span>${attempts}</span> / ${MAX_ATTEMPTS} failed attempts`;
        }
      }
    }
  }

  function grant(){
    sessionStorage.setItem('pw_auth','1');
    sessionStorage.removeItem('pw_attempts');
    sessionStorage.removeItem('pw_lockuntil');
    lockIcon.textContent='🔓';
    overlay.classList.add('show');
    // Animate progress bar then redirect
    setTimeout(()=>{progress.style.width='100%'},50);
    setTimeout(()=>{window.location.replace(PORTFOLIO_PAGE)},1600);
  }

  function startLockout(secs){
    locked=true;
    input.disabled=true;
    btn.disabled=true;
    btn.classList.add('loading');
    lockoutEl.classList.add('show');
    errMsg.classList.remove('show');
    attemptsEl.textContent='';

    let remaining=secs;
    cdEl.textContent=remaining;

    lockTimer=setInterval(()=>{
      remaining--;
      cdEl.textContent=remaining;
      if(remaining<=0){
        clearInterval(lockTimer);
        locked=false;attempts=0;
        sessionStorage.removeItem('pw_attempts');
        sessionStorage.removeItem('pw_lockuntil');
        input.disabled=false;
        btn.disabled=false;
        btn.classList.remove('loading');
        lockoutEl.classList.remove('show');
        input.focus();
      }
    },1000);
  }
})();
</script>
</body>
</html>
